name: Release

# Pushing a v* tag publishes prebuilt bookworm daemons as GitHub Release
# assets. Printers set up with `install.sh --prebuilt` download them through
# scripts/fetch_release.sh; the rest keep compiling with scripts/build.sh.
#
# Asset names carry no version, so releases/latest/download/<name> always
# resolves; the version is in the VERSION file inside each tarball.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (bookworm ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates python3 \
            libusb-1.0-0-dev libudev-dev nlohmann-json3-dev

      - uses: actions/checkout@v4

      - name: Build
        run: scripts/build.sh

      - name: Smoke test
        run: scripts/smoke_test.py bin/device_discoveryd

      - name: Package
        run: |
          name="device_discoveryd-bookworm-${{ matrix.arch }}"
          mkdir -p dist/"$name"
          cp bin/device_discoveryd dist/"$name"/
          strip dist/"$name"/device_discoveryd
          echo "$GITHUB_REF_NAME $GITHUB_SHA" > dist/"$name"/VERSION
          cp -r systemd udev docs/PROTOCOL.md LICENSE dist/"$name"/
          cd dist
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.arch }}
          path: dist/device_discoveryd-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            device_discoveryd-*.tar.gz*

  # Installs the just-published release the way a --prebuilt printer does,
  # then runs it.
  verify:
    name: verify (bookworm ${{ matrix.arch }})
    needs: publish
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git python3 libusb-1.0-0 libudev1

      - uses: actions/checkout@v4

      - name: Fetch release
        run: DD_GH_REPO="$GITHUB_REPOSITORY" scripts/fetch_release.sh "$GITHUB_REF_NAME"

      - name: Smoke test
        run: scripts/smoke_test.py bin/device_discoveryd
