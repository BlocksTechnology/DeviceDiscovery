name: Release

# Printers update by git pull + scripts/build.sh, so nothing here is deployed
# automatically. Pushing a v* tag publishes prebuilt bookworm daemons as
# GitHub Release assets, for machines that shouldn't build from source.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (bookworm ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates python3 \
            libusb-1.0-0-dev libudev-dev nlohmann-json3-dev

      - uses: actions/checkout@v4

      - name: Build
        run: scripts/build.sh

      - name: Smoke test
        run: scripts/smoke_test.py build/device_discoveryd

      - name: Package
        run: |
          name="device_discoveryd-${GITHUB_REF_NAME}-bookworm-${{ matrix.arch }}"
          mkdir "$name"
          cp build/device_discoveryd "$name/"
          strip "$name/device_discoveryd"
          cp -r systemd udev docs/PROTOCOL.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.arch }}
          path: device_discoveryd-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            device_discoveryd-*.tar.gz*
